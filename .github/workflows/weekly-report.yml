name: Report semanal Grupo Concept

on:
  schedule:
    # 08:00 em Lisboa: 08:00 UTC no inverno, 07:00 UTC no verão.
    # O script só envia no agendamento que corresponde à hora de Lisboa.
    - cron: "0 8 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = envia só para o remetente; real = envia para o cliente"
        type: choice
        options: [teste, real]
        default: teste

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar PDF e enviar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EVENTO: ${{ github.event_name }}
          AGENDAMENTO: ${{ github.event.schedule }}
          MODO: ${{ inputs.modo }}
        run: python send_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-pdf
          path: out/*.pdf
          if-no-files-found: ignore
